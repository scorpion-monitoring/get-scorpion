name: Release

# Builds and pushes the two images of docker/Dockerfile to ghcr.io (docs/plan.md §8, §9):
#   ghcr.io/scorpion-monitoring/get-scorpion         target web: nginx serving the page
#   ghcr.io/scorpion-monitoring/get-scorpion-events  target events: the events fetcher sidecar (§4)
# Tags: the full commit sha (what deployments pin, together with the digest) and `latest`. Each image
# gets an SBOM and a SLSA provenance from BuildKit, and a keyless, Sigstore-signed build provenance
# attestation (`gh attestation verify oci://<image>@<digest> -R scorpion-monitoring/get-scorpion`).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pushes queue; the last one wins `latest`.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: ghcr.io/scorpion-monitoring/get-scorpion
          - target: events
            image: ghcr.io/scorpion-monitoring/get-scorpion-events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=ISC
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: Scorecard

# OpenSSF Scorecard for this repository (docs/plan.md §8). The SARIF goes to code scanning; the
# results are also published to the Scorecard API (`publish_results`), which needs the OIDC token.
# With `publish_results`, the Scorecard API rejects a workflow with top-level `env` or `defaults`,
# write permissions at the top level, or other actions in the job than the ones used here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

# Least privilege (docs/plan.md §8).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The two permissions the action documents for a public repository.
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # OIDC token for `publish_results`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

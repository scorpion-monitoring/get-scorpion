name: Links

# lychee online on the external links of the page: the URLs in src/data/*.yaml (lychee.toml,
# docs/plan.md §8). Every failure fails the run; the instance and demo links are never excused.
# A scheduled failure opens an issue, or comments on the open one.
on:
  schedule:
    - cron: '41 4 * * *'
  pull_request:
    paths:
      - src/data/**
      - lychee.toml
      - .github/workflows/links.yml
  workflow_dispatch:

# Least privilege (docs/plan.md §8). Only `report` may write, and only issues.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned by version and the sha256 file of the release; update both together (same in ci.yml).
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only to run the package script; lychee isn't an npm package, so nothing is installed.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install lychee
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/lychee" --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee
      - name: Check the links
        run: >-
          PATH="$RUNNER_TEMP/lychee:$PATH" pnpm check:links:online
          --format markdown --output "$RUNNER_TEMP/links.md"
      - name: Show the report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/links.md" ]; then
            cat "$RUNNER_TEMP/links.md"
            cat "$RUNNER_TEMP/links.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links-report
          path: ${{ runner.temp }}/links.md
          if-no-files-found: ignore
          retention-days: 7

  # Scheduled runs only: a PR shows its failure in the check itself.
  report:
    name: report
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the failure issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled link check failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Missing if lychee failed before writing it; the issue then links the run only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: links-report
          path: ${{ runner.temp }}/report
      - name: Open or update the issue
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "The scheduled link check failed: $RUN_URL"
            echo
            echo "How to read and fix it: CONTRIBUTING.md, \"Link check failures\"."
            echo
            if [ -f "$RUNNER_TEMP/report/links.md" ]; then
              head -c 60000 "$RUNNER_TEMP/report/links.md"
            fi
          } > "$body"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

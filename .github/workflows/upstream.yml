name: Upstream

# Follows the application repo (docs/plan.md §3, §6, §8), weekly and by hand:
# - `bump`: pins scorpion-release.json to the latest release and opens or updates one pull request
#   from the fixed branch `bot/scorpion-release`. It uses a GitHub App token, because a pull request
#   opened with GITHUB_TOKEN doesn't trigger ci.yml, so its required checks would never run (§3).
# - `theme-drift`: compares the daisyUI themes in src/styles/app.css with the latest release and
#   opens or updates one issue on drift (`theme-drift-issue`).
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Least privilege (docs/plan.md §8). Only `theme-drift-issue` gets more from GITHUB_TOKEN (issues);
# `bump` writes with the App token, which is limited to this repo, contents and pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/scorpion-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in a job that writes to the repository.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Downloads the zip of the latest release, checks it like the build does, and rewrites the file.
      - name: Bump
        id: bump
        env:
          # Read-only token for the GitHub API (rate limit, docs/plan.md §3).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm bump-release
          if git diff --quiet -- scorpion-release.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(node -p "require('./scorpion-release.json').tag")" >> "$GITHUB_OUTPUT"
          fi
      # Secrets set by the maintainer (CONTRIBUTING.md, "The upstream bot"). Without `owner` and
      # `repositories` the token covers this repository only.
      - name: Create the App token
        if: steps.bump.outputs.changed == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The commit is made through the contents API, so GitHub signs it, and git needs no
      # credentials. An existing branch with an open pull request gets a new commit on top: resetting
      # it to a newer `main` could change workflow files, which the token may not do (no `workflows`
      # permission). A branch without an open pull request is left over and is recreated from `main`.
      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            if gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
            fi
            main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$main" >/dev/null
          fi
          current=$(gh api "repos/$GH_REPO/contents/scorpion-release.json?ref=$BRANCH")
          content=$(base64 -w0 scorpion-release.json)
          if [ "$(jq -r '.content' <<<"$current" | tr -d '\n')" = "$content" ]; then
            echo "$BRANCH already pins $TAG"
          else
            gh api -X PUT "repos/$GH_REPO/contents/scorpion-release.json" \
              -f message="deps: bump the Scorpion release to $TAG" \
              -f content="$content" -f branch="$BRANCH" \
              -f sha="$(jq -r '.sha' <<<"$current")" >/dev/null
          fi
          title="deps: bump the Scorpion release to $TAG"
          body="Pins \`scorpion-release.json\` to [$TAG](https://github.com/scorpion-monitoring/scorpion/releases/tag/$TAG), opened by .github/workflows/upstream.yml.

          Before merging (CONTRIBUTING.md, \"Bump the Scorpion release\"): run \`pnpm build\` on this branch and look at the feature screenshots in the light and the dark theme. If a mapped screenshot was renamed upstream, the build fails and names it; fix \`src/data/screenshots.yaml\` on this branch."
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$pr" --title "$title" --body "$body"
          fi

  theme-drift:
    name: theme-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Exit code 1 is drift, which the issue reports; any other failure fails the job.
      - name: Compare the themes
        id: check
        env:
          # Read-only token for the GitHub API (rate limit, docs/plan.md §3).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm check:theme-drift --report "$RUNNER_TEMP/theme-drift.md"
          code=$?
          set -e
          case "$code" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - if: steps.check.outputs.drift == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-drift
          path: ${{ runner.temp }}/theme-drift.md
          if-no-files-found: error
          retention-days: 7

  theme-drift-issue:
    name: theme-drift-issue
    needs: theme-drift
    if: needs.theme-drift.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the drift issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Theme drift from the application repo
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: theme-drift
          path: ${{ runner.temp }}/report
      - name: Open or update the issue
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            cat "$RUNNER_TEMP/report/theme-drift.md"
            echo
            echo "Found by $RUN_URL"
          } > "$body"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

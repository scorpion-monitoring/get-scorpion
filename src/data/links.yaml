# Links used in the nav, Get started and the footer (docs/plan.md §2). Schema: src/content.config.ts.
# `label` is a message key in messages/{en,de}.json; the link text itself lives there.
# A link has either `url` (the same for every locale) or `urls` with one URL per locale (`en`, `de`;
# both required).

releases:
  url: https://github.com/scorpion-monitoring/scorpion/releases
  label: link_get_scorpion
# User documentation (docs/plan.md §12.2): the knowledge base.
docs:
  url: https://scorpion-monitoring.github.io/knowledgebase/
  label: link_docs
# OpenAPI reference of the de.NBI / ELIXIR-DE instance. The catalogue (/denbi/catalog/services) is
# not linked until the instances run the release that has it (§12.3).
api_reference:
  url: https://scorpion.bi.denbi.de/denbi/docs
  label: link_api_reference
demo:
  url: https://test.scorpion.bi.denbi.de/
  label: link_demo
# GitHub Discussions is off on the application repo, so contact goes to the new-issue chooser (§12.4).
contact:
  url: https://github.com/scorpion-monitoring/scorpion/issues/new/choose
  label: link_contact
# The application repo, not this one (§2).
github:
  url: https://github.com/scorpion-monitoring/scorpion
  label: link_github
# OpenSSF badges of the application repo (feature card "Security assurance"). The badge images are
# downloaded at build time by scripts/fetch-docs-export.mjs and served from our own origin (§6).
best_practices:
  url: https://www.bestpractices.dev/projects/15237
  label: link_best_practices
scorecard:
  url: https://scorecard.dev/viewer/?uri=github.com/scorpion-monitoring/scorpion
  label: link_scorecard
# IPK's imprint and privacy policy, in the page locale (docs/plan.md §1, decision of 2026-11-20).
# The standard IPK privacy policy applies to this site, so there is no page of our own.
imprint:
  urls:
    en: https://www.ipk-gatersleben.de/en/imprint
    de: https://www.ipk-gatersleben.de/impressum
  label: link_imprint
privacy:
  urls:
    en: https://www.ipk-gatersleben.de/en/data-protection-policy
    de: https://www.ipk-gatersleben.de/datenschutzerklaerung
  label: link_privacy

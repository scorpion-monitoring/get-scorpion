# The landing page's server block (docs/plan.md §9); replaces the base image's conf.d/default.conf.
# It serves /, /de/, /robots.txt, /sitemap.xml, assets and /events/. /denbi/ and /nfdi/ are routed by
# Traefik and never reach this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind Traefik: redirects (/de -> /de/) keep a relative Location instead of http://<pod>:8080.
    absolute_redirect off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml text/plain;
    # src/pages/404.astro, in both languages; served through location / with the same headers.
    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets: cached for a year.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The events feed (§4): the sidecar keeps /srv/events/events.json(ld) current; until it has written
    # a file, the empty fallback from the image (public/events/) is served. nginx's mime.types doesn't
    # know .jsonld. No restart is needed when a file is replaced.
    location /events/ {
        root /srv;
        types {
            application/json json;
            application/ld+json jsonld;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri @events_fallback;
    }

    location @events_fallback {
        types {
            application/json json;
            application/ld+json jsonld;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # HTML and everything else: revalidated on every request (ETag). A directory without its slash gets
    # a 301 to the slash form; a missing file a 404.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

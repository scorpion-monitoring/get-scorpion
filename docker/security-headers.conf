# Security headers of docs/plan.md §6, included in every location of nginx.conf (an add_header in a
# location drops the inherited ones). The container sets all of them; Traefik and sargas pass responses
# through unchanged. The CSP must equal CSP in scripts/lib/static-server.mjs (browser checks in CI).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
# Same value as the Scorpion instances on this host (/denbi, /nfdi), so the last response seen doesn't
# change the browser's HSTS policy. Browsers ignore it over plain http (local runs).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
